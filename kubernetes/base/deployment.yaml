apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-app
  namespace: nexus
  labels:
    app: nexus-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nexus-app
    spec:
      containers:
      - name: nexus-app
        image: 411471606336.dkr.ecr.eu-west-2.amazonaws.com/nexus-platform/app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-app
  namespace: nexus
spec:
  type: ClusterIP
  selector:
    app: nexus-app
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http