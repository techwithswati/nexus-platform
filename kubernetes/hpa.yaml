# Horizontal Pod Autoscaler for the nexus Flask app
# Requires metrics-server: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexus-app
  namespace: nexus
  labels:
    app: nexus-app
    component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexus-app

  minReplicas: 2    # Never below 2 - zero-downtime guarantee
  maxReplicas: 10

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70   # Scale out at 70% CPU

  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  behaviour:
    scaleUp:
      stabilizationWindowSeconds: 30    # React quickly under load
      policies:
        - type: Pods 
          value: 2                      # Add max 2 pods at atime
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # Wait 5 min before scaling down
      policies:
        - type: Pods 
          value: 1
          periodSeconds: 60
