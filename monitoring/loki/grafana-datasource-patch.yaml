apiVersion: v1
kind: ConfigMap 
metadata:
  name: grafana-loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"    # Picked up automatically by Grafana sidecar
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        version: 1
        editable: false
        jsonData:
          derivedFields:
            - datasourceUid: prometheus
              matcherRegex: "trace_id=(\\w+)"
              name: TraceID
              url: "${__value.raw}"
